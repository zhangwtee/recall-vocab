<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>单词 · 主动回忆</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236ea8fe'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1115; --card:#191d24; --card2:#222732; --line:#303744;
  --fg:#e8eaed; --dim:#9aa3b2; --dim2:#6b7482;
  --blue:#6ea8fe; --blue2:#4b8ef5;
  --green:#4ade80; --yellow:#fbbf24; --red:#f87171;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:680px;height:100%;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* 顶栏 */
header{flex:none;display:flex;align-items:center;gap:12px;padding:16px 20px 8px}
.brand{font-size:15px;font-weight:600;letter-spacing:.5px;color:var(--dim)}
.brand b{color:var(--fg)}
.book-trigger{background:none;border:0;padding:4px 8px 4px 0;cursor:pointer;font:inherit;
  display:inline-flex;align-items:center;gap:6px;border-radius:8px;transition:background .15s}
.book-trigger:hover{background:var(--card2)}
.book-trigger b{font-size:16px}
.brand-arrow{font-size:12px;color:var(--blue);transition:transform .15s}
.brand-sub{font-size:12px;color:var(--dim2);font-weight:400}
/* 快捷选书面板 */
#bookPicker,#planPanel{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:22;
  display:flex;justify-content:center;align-items:flex-start;padding-top:8vh}
#bookPicker.hidden,#planPanel.hidden{display:none}
.bp-card{width:92%;max-width:460px;max-height:84vh;overflow:hidden;background:var(--bg);
  border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;
  box-shadow:0 12px 40px rgba(0,0,0,.3)}
.bp-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.bp-head h2{margin:0 0 3px;font-size:17px}
.bp-head p{margin:0;font-size:12px;color:var(--dim2)}
.bp-body{flex:1;overflow-y:auto;padding:14px 18px 22px;-webkit-overflow-scrolling:touch}
.bp-foot{flex:none;padding:10px 18px;border-top:1px solid var(--line);text-align:center}
.bp-foot button{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
/* 今日计划面板内的控件 */
.plan-big{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 14px}
.plan-big input{width:96px;padding:12px;text-align:center;font-size:28px;font-weight:650;
  background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--fg)}
.plan-big span{font-size:14px;color:var(--dim)}
.plan-quick{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.plan-quick button{flex:1;padding:9px 0;background:var(--card);border:1px solid var(--line);
  border-radius:9px;color:var(--fg);font-size:13px;cursor:pointer}
.plan-quick button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.plan-stat{display:flex;justify-content:space-around;padding:12px 0;margin-bottom:4px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.plan-stat div{text-align:center}
.plan-stat .n{font-size:20px;font-weight:650}
.plan-stat .t{font-size:11px;color:var(--dim2);margin-top:2px}
.plan-extra{display:flex;gap:8px;margin-top:12px}
.plan-extra button{flex:1;padding:10px 4px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;color:var(--dim);font-size:12px;cursor:pointer;white-space:nowrap}
.plan-extra button:active{background:var(--card2)}
.plan-save{width:100%;padding:12px;background:var(--blue);border:0;border-radius:9px;
  color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border:0;border-radius:10px;background:var(--card2);color:var(--dim);
  font-size:18px;cursor:pointer;display:grid;place-items:center}
.icon-btn:active{background:var(--line)}
.progress-pill{font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:6px 12px;white-space:nowrap}
.plan-trigger{cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
.plan-trigger:hover{border-color:var(--blue);background:var(--card2)}
.pill-arrow{color:var(--blue);font-size:10px;margin-left:2px}
.bar{height:3px;background:var(--card);margin:0 20px;border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}

/* 卡片 */
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.card{width:100%;max-width:520px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:32px 24px 24px;display:flex;flex-direction:column;align-items:center;
  box-shadow:0 12px 40px rgba(0,0,0,.28)}
.word{font-size:clamp(38px,10vw,60px);font-weight:650;letter-spacing:-1px;line-height:1.15;
  text-align:center;word-break:break-word;margin-bottom:10px;cursor:pointer}
.word:hover{color:var(--blue)}
.phonetic{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:16px;min-height:26px}
.speak{border:0;background:var(--card2);color:var(--blue);width:36px;height:36px;border-radius:50%;
  font-size:16px;cursor:pointer;display:grid;place-items:center;flex:none}
.speak:active{transform:scale(.92)}
.example{margin-top:14px;color:var(--dim);font-size:14px;text-align:center;line-height:1.6;
  font-style:italic;max-width:100%}
.examples{margin:14px 0 16px}
.ex-title{font-size:11px;color:var(--dim2);text-align:center;margin-bottom:8px;letter-spacing:1px}
.ex-row{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:7px}
.ex-en{font-size:14px;line-height:1.5;display:flex;align-items:flex-start;gap:8px}
.ex-en .ex-speak{margin-left:auto;flex:none}
.ex-speak{background:none;border:0;color:var(--dim);font-size:13px;cursor:pointer;padding:2px 4px}
.ex-speak:hover{color:var(--blue)}
.ex-cn{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}
.divider{width:100%;height:1px;background:var(--line);margin:26px 0 22px}
.hint{color:var(--dim2);font-size:13px;text-align:center;line-height:1.7;margin-bottom:20px}
.reveal{width:100%;padding:16px;border:0;border-radius:12px;background:var(--blue);color:#0b1220;
  font-size:16px;font-weight:650;cursor:pointer;transition:filter .15s,transform .1s}
.reveal:hover{filter:brightness(1.08)}
.reveal:active{transform:scale(.985)}
.meaning{width:100%;text-align:center;font-size:19px;line-height:1.7;margin-bottom:26px;
  animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ratings{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.rate{padding:14px 4px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);
  color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:5px;transition:transform .1s,background .15s}
.rate:active{transform:scale(.96)}
.rate small{font-size:11px;font-weight:400;color:var(--dim2)}
.rate[data-g="1"]:active{background:rgba(248,113,113,.18)}
.rate[data-g="2"]:active{background:rgba(251,191,36,.18)}
.rate[data-g="3"]:active{background:rgba(74,222,128,.18)}
.rate[data-g="1"] b{color:var(--red)}
.rate[data-g="2"] b{color:var(--yellow)}
.rate[data-g="3"] b{color:var(--green)}
.mode-switch{display:flex;gap:6px;margin-bottom:12px}
.mode-switch button{flex:1;padding:7px;border:1px solid var(--line);border-radius:8px;
  background:transparent;color:var(--dim2);font-size:12px;cursor:pointer}
.mode-switch button.on{background:var(--card2);color:var(--blue);border-color:var(--blue)}
.typebox{width:100%}
.type-input{width:100%;padding:15px 12px;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;color:var(--fg);font-size:17px;text-align:center;outline:none;
  transition:border-color .15s}
.type-input:focus{border-color:var(--blue)}
.type-input::placeholder{color:var(--dim2)}
.submit{width:100%;padding:14px;border:0;border-radius:12px;background:var(--blue);color:#0b1220;
  font-size:16px;font-weight:650;cursor:pointer;margin-top:10px}
.giveup{width:100%;padding:10px;border:0;background:transparent;color:var(--dim2);
  font-size:12px;cursor:pointer;margin-top:12px}
.giveup:hover{color:var(--dim)}
/* 判定条：单独一条带底色，不跟上面的分隔线、下面的对比框糊在一起 */
.verdict{width:100%;text-align:center;font-size:15px;font-weight:650;line-height:1.45;
  padding:9px 12px;border-radius:10px;margin:0 0 12px;background:var(--card2);color:var(--dim)}
.verdict.right{color:var(--green);background:rgba(74,222,128,.10)}
.verdict.near{color:var(--yellow);background:rgba(251,191,36,.10)}
.verdict.wrong{color:var(--red);background:rgba(248,113,113,.10)}
.verdict.giveup{color:var(--dim)}
.compare{width:100%;background:var(--card2);border-radius:10px;padding:12px 14px;margin-bottom:18px}
.compare .line{display:flex;gap:10px;font-size:14px;line-height:1.65;padding:3px 0}
.compare .line .k{color:var(--dim2);flex:0 0 3.6em;white-space:nowrap}
.compare .line .v{color:var(--fg);word-break:break-all}
/* 底部操作栏：间距用 margin 给，不依赖 flex gap（老 WebView 上 gap 不生效会贴在一起） */
.fbops{width:100%;display:flex;align-items:stretch}
#dock{flex:none;width:100%;max-width:680px;margin:0 auto;padding:6px 16px 8px;display:none}
#dock.show{display:block}
.fbops .btn-main,.fbops .btn-alt,.fbops .btn-undo{-webkit-appearance:none;appearance:none;
  min-height:50px;border-radius:12px;cursor:pointer;margin:0}
.fbops .btn-main{flex:1 1 auto;min-width:0;margin-right:12px;padding:10px 12px;border:0;
  background:var(--blue);color:#0b1220;font-size:15px;font-weight:650;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbops .btn-alt{flex:0 0 auto;padding:10px 18px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:13px;white-space:nowrap}
.fbops .btn-undo{flex:0 0 auto;margin-right:12px;padding:10px 11px;border:1px solid var(--line);
  background:transparent;color:var(--dim2);font-size:12px;white-space:nowrap}
.fbops .btn-main:last-child,.fbops .btn-undo:last-child{margin-right:0}
@media (max-width:360px){
  .fbops .btn-alt{padding:0 11px;font-size:12px}
  .fbops .btn-undo{padding:0 9px;margin-right:9px}
  .fbops .btn-main{margin-right:9px}
}
.done{text-align:center;color:var(--dim);line-height:2;margin:auto}
.done .big{font-size:44px;margin-bottom:8px}
.done .title{font-size:20px;color:var(--fg);font-weight:600;margin-bottom:16px}
.done button{margin-top:22px;padding:12px 26px;border:1px solid var(--line);border-radius:10px;
  background:var(--card2);color:var(--fg);cursor:pointer;font-size:14px}

/* 底栏 */
footer{flex:none;padding:8px 20px 16px;display:flex;justify-content:space-between;
  color:var(--dim2);font-size:11px;gap:10px}
footer span{white-space:nowrap}

/* 设置面板 */
.panel{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;justify-content:flex-end}
.panel.hidden{display:none}
.sheet{width:100%;max-width:480px;height:100%;background:var(--bg);border-left:1px solid var(--line);
  display:flex;flex-direction:column;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{flex:none;display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px}
.tabs{display:flex;gap:4px;padding:12px 16px 0;flex:none}
.tab{flex:1;padding:9px;border:0;background:transparent;color:var(--dim);font-size:13px;cursor:pointer;
  border-bottom:2px solid transparent}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.sheet-body{flex:1;overflow-y:auto;padding:18px 20px 40px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .label{font-size:14px}
.row .sub{font-size:11px;color:var(--dim2);margin-top:3px;line-height:1.5}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:3px;flex:none}
.seg button{border:0;background:transparent;color:var(--dim);padding:7px 11px;border-radius:7px;
  font-size:12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--blue);color:#0b1220;font-weight:600}
.btn{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);
  color:var(--fg);font-size:14px;cursor:pointer;margin-top:10px}
.btn.danger{color:var(--red)}
.btn:active{background:var(--line)}
textarea{width:100%;min-height:130px;background:var(--card);color:var(--fg);border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;
  resize:vertical;line-height:1.6}
.note{font-size:12px;color:var(--dim);line-height:1.8;margin:10px 0 4px}
.note code{background:var(--card2);padding:2px 5px;border-radius:4px;font-size:11px}
.wordcard{width:88%;max-width:400px;max-height:82vh;overflow-y:auto;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:22px;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
.wordcard .wc-word{font-size:30px;font-weight:650;text-align:center}
.wordcard .wc-ph{color:var(--dim);font-size:14px;text-align:center;margin:4px 0 14px}
.wordcard .wc-mean{font-size:14px;line-height:1.7;text-align:center;padding:12px;
  background:var(--card2);border-radius:10px;margin-bottom:16px}
.wc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}
.wc-cell{background:var(--card2);border-radius:9px;padding:10px 12px}
.wc-cell .n{font-size:17px;font-weight:600}
.wc-cell .t{font-size:10px;color:var(--dim2);margin-top:2px}
.note-box{margin:0 0 14px;padding:10px 12px;background:rgba(110,168,254,.08);
  border:1px solid rgba(110,168,254,.25);border-radius:10px;font-size:13px;line-height:1.6}
.note-box .nt{display:block;font-size:10px;color:var(--blue);margin-bottom:4px;letter-spacing:1px}
.note-box.ref-box{background:rgba(126,203,161,.08);border-color:rgba(126,203,161,.25)}
.note-box.ref-box .nt{color:var(--green,#7ecba1)}
.ref-pos{display:inline-block;font-size:10px;color:var(--dim2);border:1px solid var(--line);
  border-radius:4px;padding:0 4px;margin-right:6px}
.note-edit textarea{width:100%;min-height:76px;padding:10px 12px;background:var(--card2);
  border:1px solid var(--line);border-radius:9px;color:var(--fg);font-size:13px;
  font-family:inherit;line-height:1.5;resize:vertical}
.wc-close{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;
  background:var(--card2);color:var(--fg);cursor:pointer;font-size:13px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 14px 12px;margin-bottom:14px}
.chart-title{font-size:13px;font-weight:600;margin-bottom:3px}
.chart-sub{font-size:11px;color:var(--dim2);margin-bottom:12px;line-height:1.5}
.chart-card svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.hm-wrap{overflow-x:auto;padding-bottom:4px}
.hm-grid{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;
  grid-auto-columns:13px;gap:3px;width:max-content}
.hm-cell{width:13px;height:13px;border-radius:3px;background:var(--card2);
  border:1px solid var(--line);flex:none}
.hm-cell.lv1{background:#1d3a5c;border-color:#1d3a5c}
.hm-cell.lv2{background:#2d5f96;border-color:#2d5f96}
.hm-cell.lv3{background:#4b8ef5;border-color:#4b8ef5}
.hm-cell.lv4{background:#7db4ff;border-color:#7db4ff}
.hm-cell.future{opacity:.25}
.hm-foot{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:11px;color:var(--dim2)}
.vocab-box{display:flex;align-items:center;gap:18px}
.vocab-detail{flex:1;font-size:12px;line-height:1.9}
.vocab-detail b{font-size:15px;color:var(--fg)}
.vocab-detail span{color:var(--dim2);font-size:11px}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex:0 0 auto;padding:7px 14px;border:1px solid var(--line);border-radius:18px;
  background:var(--card);color:var(--dim);font-size:13px;cursor:pointer;white-space:nowrap}
.cat-tab.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.book-group{margin-bottom:16px}
.book-group-t{font-size:12px;font-weight:600;color:var(--dim);margin:0 0 8px 2px;
  display:flex;align-items:center;gap:7px}
.book-group-t:after{content:'';flex:1;height:1px;background:var(--line)}
.books{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.book-item{position:relative;padding:11px 12px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;color:var(--fg);cursor:pointer;text-align:left;display:flex;
  flex-direction:column;gap:3px;transition:border-color .15s,background .15s}
.book-item:hover{border-color:var(--blue)}
.book-item.on{background:rgba(110,168,254,.12);border-color:var(--blue)}
.book-item .bn{font-size:14px;font-weight:600;padding-right:16px}
.book-item .bd{font-size:11px;color:var(--dim);line-height:1.4;min-height:2.8em}
.book-item .bc{font-size:10px;color:var(--dim2)}
.book-item .bk{position:absolute;top:9px;right:9px;font-size:12px;color:var(--blue);font-weight:700}
.book-empty{padding:24px;text-align:center;color:var(--dim2);font-size:13px}
.search{width:100%;padding:11px 13px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;color:var(--fg);font-size:14px;margin-bottom:12px}
.wlist{display:flex;flex-direction:column;gap:8px}
.witem{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.witem .top{display:flex;align-items:baseline;gap:9px}
.witem .w{font-size:16px;font-weight:600}
.witem .st{font-size:11px;color:var(--blue);margin-left:auto;white-space:nowrap}
.witem .m{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}
.witem .ops{display:flex;gap:8px;margin-top:9px}
.witem .ops button{border:1px solid var(--line);background:var(--card2);color:var(--dim);
  border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer}
.witem .ops button:hover{color:var(--fg)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .n{font-size:24px;font-weight:650}
.stat .t{font-size:11px;color:var(--dim);margin-top:4px}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
  background:var(--card2);border:1px solid var(--line);color:var(--fg);padding:11px 20px;
  border-radius:10px;font-size:13px;z-index:50;opacity:0;transition:.25s;pointer-events:none;
  white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#boot{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;
  justify-content:center;transition:opacity .3s}
#boot.hidden{opacity:0;pointer-events:none}
.boot-inner{text-align:center;color:var(--dim);font-size:14px;padding:24px}
.boot-spin{width:38px;height:38px;margin:0 auto 18px;border:3px solid var(--line);
  border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-sub{font-size:12px;color:var(--dim2);margin-top:8px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;
  font-family:ui-monospace,monospace;font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="brand book-trigger" data-action="openBookPicker" title="点击切换词书"><b id="bookLabel">四级</b><span class="brand-arrow">▾</span><span class="brand-sub">主动回忆</span></button>
    <div class="spacer"></div>
    <button class="progress-pill plan-trigger" id="pill" data-action="openPlan" title="点击设置每日新词">今日 0 / 0 <span class="pill-arrow">▾</span></button>
    <button class="icon-btn" data-action="settings" title="设置">⚙</button>
  </header>
  <div class="bar"><i id="barFill"></i></div>
  <main id="stage"></main>
  <div id="dock"></div>
  <footer>
    <span id="statNew">新词 0</span>
    <span id="statReview">复习 0</span>
    <span id="statAcc">正确率 —</span>
  </footer>
</div>

<div id="panel" class="panel hidden">
  <div class="sheet">
    <div class="sheet-head">
      <h2>设置</h2>
      <div class="spacer"></div>
      <button class="icon-btn" data-action="closePanel">✕</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="general">常规</button>
      <button class="tab" data-tab="words">词库</button>
      <button class="tab" data-tab="stats">统计</button>
      <button class="tab" data-tab="data">数据</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div id="wordPanel" class="panel hidden" style="justify-content:center;align-items:center">
  <div class="wordcard" id="wordCard"></div>
</div>
<div id="bookPicker" class="hidden">
  <div class="bp-card">
    <div class="bp-head"><h2>选择词书</h2><p id="bpCurrent">当前：四级大全</p></div>
    <div class="bp-body">
      <input class="search" data-role="bookSearch" placeholder="搜索词书名称或说明" autocomplete="off">
      <div data-role="bookGridHost"></div>
    </div>
    <div class="bp-foot"><button data-action="closeBookPicker">关闭</button></div>
  </div>
</div>
<div id="planPanel" class="hidden">
  <div class="bp-card">
    <div class="bp-head"><h2>今日计划</h2><p>想每天背多少个新词？随时可改</p></div>
    <div class="bp-body">
      <div class="plan-big"><input type="number" id="planInput" min="1" max="500" value="20"><span>个新词 / 天</span></div>
      <div class="plan-quick">
        <button data-plan="10">10</button><button data-plan="20">20</button>
        <button data-plan="30">30</button><button data-plan="50">50</button>
        <button data-plan="100">100</button>
      </div>
      <div class="plan-stat">
        <div><div class="n" id="planNew">0</div><div class="t">今日新词</div></div>
        <div><div class="n" id="planDue">0</div><div class="t">待复习</div></div>
        <div><div class="n" id="planLearned">0</div><div class="t">累计已学</div></div>
      </div>
      <div class="plan-extra">
        <button data-action="reviewLearned" data-days="1">复习昨天学的</button>
        <button data-action="reviewLearned" data-days="3">复习近 3 天</button>
      </div>
      <div class="plan-extra">
        <button data-action="cutToday" data-n="10">今天少背 10 个</button>
        <button data-action="resetToday">恢复今日计划</button>
      </div>
      <div class="note" style="margin:12px 0 0">改大：今天立刻多引入新词。改小：今天已引入的不撤回，明天起按新数量走。<br>复习按钮把那几天学过的词插到队列最前面，再评一次后会按新的反馈重新排期。</div>
    </div>
    <div class="bp-foot"><button data-action="savePlan" class="plan-save">保存并更新今日队列</button></div>
  </div>
</div>
<div id="toast"></div>
<div id="boot"><div class="boot-inner"><div class="boot-spin"></div><div id="bootMsg">正在加载词库…</div><div class="boot-sub">首次使用需联网获取，之后离线可用</div></div></div>

<script>
/*__FSRS__*/
/*__WORDS__*/
/*__LOADER__*/
(function(){
'use strict';
var WORDS = window.CET4_WORDS || [];
function getBooks(){ return window.WORD_BOOKS || []; }
function bookById(id){ var bs=getBooks(); for(var i=0;i<bs.length;i++) if(bs[i].id===id) return bs[i]; return null; }
var LS = 'nixiang.memo.v1';
var DAY = 86400000;

// ── 状态 ─────────────────────────────────────────────────
function defaults(){
  return {
    version:1,
    settings:{ dailyNew:20, retention:0.9, accent:'en-US', autoSpeak:false,
               autoSpeakShow:true, hidePh:false, bookId:'cet4', customOn:false, dataBase:'' },
    cards:{}, customPool:[], dailyLog:{}, createdAt:Date.now()
  };
}
function load(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw) return defaults();
    var s = JSON.parse(raw);
    if(!s || s.version !== 1) return defaults();
    var d = defaults();
    s.settings = Object.assign(d.settings, s.settings||{});
    // 旧版本字段迁移
    if(s.settings.poolMode){
      s.settings.bookId = s.settings.poolMode==='custom' ? 'cet4' : 'cet4';
      s.settings.customOn = s.settings.poolMode!=='builtin';
      delete s.settings.poolMode;
    }
    s.cards = s.cards||{}; s.customPool = s.customPool||[]; s.dailyLog = s.dailyLog||{};
    return s;
  }catch(e){ return defaults(); }
}
var state = load();
// 有些环境（iOS 的文件预览、隐私模式、file:// 受限策略）不允许写本地存储，
// 这时程序还能跑，但进度关掉就没了，必须在界面上说清楚。
var storageOK = (function(){
  try{
    var k='__memo_probe__';
    localStorage.setItem(k,'1');
    var v=localStorage.getItem(k);
    localStorage.removeItem(k);
    return v==='1';
  }catch(e){ return false; }
})();
function warnNoStorage(){
  if(document.getElementById('lsWarn')) return;
  var d=document.createElement('div');
  d.id='lsWarn';
  d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:80;background:#8a3a2a;color:#fff;'+
    'font-size:13px;line-height:1.5;padding:10px 44px 10px 14px;box-shadow:0 -2px 10px rgba(0,0,0,.2)';
  d.innerHTML='<b>此环境无法保存学习进度</b><br>'+
    '浏览器禁止了本页的本地存储（常见于文件预览、无痕模式）。可以正常背词，但关掉后会全部丢失。'+
    '建议换 Chrome / Safari 正常打开，或改用托管链接。';
  var x=document.createElement('div');
  x.textContent='×';
  x.style.cssText='position:absolute;right:14px;top:8px;font-size:20px;cursor:pointer;opacity:.8';
  x.onclick=function(){ d.remove(); };
  d.appendChild(x);
  document.body.appendChild(d);
}
var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(LS, JSON.stringify(state)); }
    catch(e){ if(!storageOK) warnNoStorage(); else toast('保存失败：本地存储已满，请导出备份'); }
  }, 120);
}
function saveNow(){
  clearTimeout(saveTimer);
  try{ localStorage.setItem(LS, JSON.stringify(state)); }
  catch(e){ if(!storageOK) warnNoStorage(); else toast('保存失败：本地存储已满'); }
}
function todayKey(){
  var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayLog(){
  var k=todayKey();
  if(!state.dailyLog[k]) state.dailyLog[k]={neu:0,intro:0,rev:0,again:0,hard:0,good:0};
  if(state.dailyLog[k].intro==null) state.dailyLog[k].intro = state.dailyLog[k].neu||0;
  return state.dailyLog[k];
}
// 清掉今天引入但还没评分的占位卡，让新词库能立刻开始背
function resetPendingNew(){
  for(var k in state.cards){
    if(state.cards[k].state==='new') delete state.cards[k];
  }
  todayLog().intro = 0;
}

// ── 词池 ─────────────────────────────────────────────────
function pool(){
  var b = bookById(state.settings.bookId);
  var builtin = b ? b.words : WORDS;
  var src = state.settings.customOn ? builtin.concat(state.customPool) : builtin;
  var seen = {}, out = [];
  for(var i=0;i<src.length;i++){
    var w = src[i], k = String(w.w||'').toLowerCase();
    if(!k || seen[k]) continue;
    seen[k]=1; out.push(w);
  }
  return out;
}
function bookName(){
  var b = bookById(state.settings.bookId);
  return b ? b.name : '四级';
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
function cardKey(w){ return String(w).toLowerCase(); }

// ── 会话 ─────────────────────────────────────────────────
var session = { queue:[], shown:{}, total:0, done:0 };
var bookCat = '', bookQuery = '';
var current = null, tab = 'general';
var feedback = null;   // 输入模式判分后的反馈
var inputMode = 'cn';  // cn=写中文释义，en=拼英文单词；切换只影响当前这次输入

function makeCard(w){
  var c = FSRS.newCard();
  c.w=w.w; c.p=w.p||''; c.m=w.m||''; c.ex=w.ex||'';
  c.tip=w.tip||''; c.lxyEx=w.ex||null; c.ref=w.ref||null;
  c.alt=w.alt||null;
  c.enabled=true; c.addedAt=Date.now(); c.note='';
  return c;
}
function buildSession(){
  var now = Date.now();
  var due = [];
  for(var k in state.cards){
    var c = state.cards[k];
    if(c.enabled === false) continue;
    if((c.dueAt||0) <= now) due.push(c);
  }
  due.sort(function(a,b){ return a.dueAt-b.dueAt; });

  var log = todayLog();
  // 当天临时上限只影响今天：明天生成新的 dailyLog，cap 自然失效
  var cap = Math.max(0, Math.min(state.settings.dailyNew,
    log.cap == null ? state.settings.dailyNew : log.cap));
  var need = Math.max(0, cap - (log.intro||0));
  // 词书已按常用度排序（COCA 词频升序），新词照此顺序引入，先学高频词。
  var fresh = pool().filter(function(p){ return !state.cards[cardKey(p.w)]; });
  var news = [];
  for(var i=0;i<need && i<fresh.length;i++){
    var c = makeCard(fresh[i]);
    state.cards[cardKey(c.w)] = c;
    news.push(c);
  }
  if(news.length){
    log.intro = (log.intro||0) + news.length;
    save();
  }
  session.queue = due.concat(news);
  session.shown = {};
  session.total = session.queue.length;
  session.done = 0;
}
// 手动复习：把指定日期学过的词插回今天的队列，不改动它们原定排期
function dayKeyOf(ts){
  var d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function reviewLearned(days){
  var base = new Date(); base.setHours(0,0,0,0);
  var want = {};
  for(var i=1;i<=days;i++) want[dayKeyOf(base.getTime()-i*DAY)] = 1;
  var inQueue = {};
  for(var j=0;j<session.queue.length;j++){
    var q = session.queue[j];
    if(q) inQueue[cardKey(q.w)] = 1;
  }
  if(current) inQueue[cardKey(current.w)] = 1;
  var picked = [];
  for(var k in state.cards){
    var c = state.cards[k];
    if(c.enabled === false || c.state === 'new') continue;
    if(!want[dayKeyOf(c.lastReview||0)]) continue;
    if(inQueue[k]) continue;
    picked.push(c);
  }
  if(!picked.length){ toast('那几天还没有学过的词'); return; }
  picked.sort(function(a,b){ return (a.lastReview||0)-(b.lastReview||0); });
  session.queue = picked.concat(session.queue);
  session.total = session.done + session.queue.length;
  document.getElementById('planPanel').classList.add('hidden');
  header();
  toast('已把 '+picked.length+' 个词插到最前面复习');
}
function cutToday(n){
  var log = todayLog();
  var cur = log.cap == null ? state.settings.dailyNew : log.cap;
  log.cap = Math.max(0, cur - n);
  saveNow(); buildSession(); next(); renderSheet(); header();
  toast('今天最多背 '+log.cap+' 个新词');
}
function resetToday(){
  var log = todayLog();
  delete log.cap;
  saveNow(); buildSession(); next(); renderSheet(); header();
  toast('已恢复今日计划：'+state.settings.dailyNew+' 个新词');
}
function next(){
  if(current) session.done++;
  current = session.queue.shift() || null;
  feedback = null;
  autoSpokenKey = null;
  if(current){
    var k = cardKey(current.w);
    session.shown[k] = (session.shown[k]||0)+1;
  }
  render();
  speakOnShow();
}

// ── 交互 ─────────────────────────────────────────────────
// 不写字，直接选档位
function quickRate(g){
  if(!current || feedback) return;
  feedback = { input:'', expected:current.m, verdict:'chosen', score:0, matched:'', g:g };
  if(state.settings.autoSpeak) speak(current.w);
  render();
}
// 只做调度和记账，不切换卡片。输入模式要先展示反馈，确认后才调用它。
function applyRating(g){
  if(!current) return;
  var c = current, wasNew = (c.state==='new');
  FSRS.schedule(c, g, Date.now(), {retention:Number(state.settings.retention)||0.9});
  state.cards[cardKey(c.w)] = c;
  var log = todayLog();
  if(wasNew) log.neu++; else log.rev++;
  if(g===1) log.again++; else if(g===2) log.hard++; else log.good++;
  save();

  var k = cardKey(c.w);
  if((c.dueAt - Date.now()) < 30*60000 && (session.shown[k]||0) < 3){
    session.queue.push(c);
  }
}
// 输入模式：提交中文 → 判分 → 展示反馈
function submitInput(){
  if(!current || feedback) return;
  var inp = document.getElementById('typeInput');
  var val = inp ? inp.value.trim() : '';
  if(!val){ toast('先写出意思，或点「想不起来」'); if(inp) inp.focus(); return; }
  var spell = inputMode==='en';
  var j = spell ? judgeSpell(val, current.w) : judge(val, current.m, current.alt);
  feedback = { input:val, expected:spell?current.w:current.m, mode:spell?'en':'cn',
               verdict:j.verdict, score:j.score, matched:j.matched, altHit:j.alt, g:j.g };
  if(state.settings.autoSpeak) speak(current.w);
  render();
}
// 反馈页确认：按自动判分走，或强制算认识（同义词被误判时用）。
// 评分前留一份快照，误判时可以连卡片状态、当日统计和队列一起还原。
var undoSnap = null;
function confirmFeedback(forceGood){
  if(!feedback || !current) return;
  var k = cardKey(current.w);
  undoSnap = {
    key:k, card:JSON.stringify(current), log:JSON.stringify(todayLog()),
    queue:session.queue.slice(), done:session.done
  };
  applyRating(forceGood ? 3 : feedback.g);
  next();
}
function undoRating(){
  if(!undoSnap) return;
  var s = undoSnap; undoSnap = null;
  state.cards[s.key] = JSON.parse(s.card);
  state.dailyLog[todayKey()] = JSON.parse(s.log);
  session.queue = s.queue;
  session.done = s.done;
  var c = state.cards[s.key];
  session.queue.unshift(c);
  current = c;
  feedback = null;
  saveNow(); render();
  toast('已撤销这次评分');
}
// 朗读：优先系统语音引擎；引擎缺失或没装英文语音时，退到在线词典音频。
// 两者都没有才提示一次，避免每次点击都弹同样的报错。
var TTS_OK = ('speechSynthesis' in window);
var speechWarned = false;
var speechStarted = false;                  // 最近一次朗读有没有真的出声
var autoSpokenKey = null, speechPrimed = false;
function isSingleWord(t){ return /^[A-Za-z][A-Za-z'’\-]*$/.test(String(t||'').trim()); }
function warnNoSpeech(why){
  if(speechWarned) return;
  speechWarned = true;
  toast(why || '这个浏览器不能朗读 · 换 Chrome 或 Safari 打开就有声音');
}
function speakOnline(text, quiet){
  if(!isSingleWord(text)) return false;
  try{
    var a = new Audio('https://dict.youdao.com/dictvoice?type='
      + (state.settings.accent==='en-GB' ? 1 : 2)
      + '&audio=' + encodeURIComponent(String(text).trim()));
    var p = a.play();
    if(p && p.then) p.then(function(){ speechStarted = true; },
      function(){ if(!quiet) warnNoSpeech('朗读不可用：本机没有语音引擎，在线音频也取不到 · 换 Chrome 或 Safari 试试'); });
    return true;
  }catch(e){ return false; }
}
function speak(text, quiet){
  if(!text) return;
  speechStarted = false;
  if(TTS_OK){
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var accent = state.settings.accent;
      u.lang = accent; u.rate = 0.85;
      var vs = speechSynthesis.getVoices()||[];
      var v = null;
      for(var i=0;i<vs.length;i++){ if(vs[i].lang===accent){ v=vs[i]; break; } }
      if(!v) for(var j=0;j<vs.length;j++){ if(/^en/i.test(vs[j].lang)){ v=vs[j]; break; } }
      if(v) u.voice = v;
      u.onstart = function(){ speechStarted = true; };
      speechSynthesis.speak(u);
      // 没装英文语音时 speak 不报错也不出声，等不到开始事件就换在线音频
      setTimeout(function(){
        if(speechStarted) return;
        if(speechSynthesis.speaking || speechSynthesis.pending) return;
        if(!speakOnline(text, quiet) && !quiet) warnNoSpeech();
      }, 1200);
      return;
    }catch(e){}
  }
  if(!speakOnline(text, quiet) && !quiet) warnNoSpeech();
}
// 新词出现就读一遍；同一张卡重复渲染（揭晓、撤销）不再读。
function speakOnShow(force){
  if(!state.settings.autoSpeakShow || !current) return;
  var k = cardKey(current.w);
  if(autoSpokenKey === k && !force) return;
  autoSpokenKey = k;
  speak(current.w, true);   // 自动朗读失败不弹提示，免得每出一词都打扰
}
// 手机浏览器会拦掉没有用户手势的首次朗读：第一次碰屏幕时补读当前词。
function primeSpeech(e){
  var t = e && e.target;
  if(t && t.closest && t.closest('button,[data-action]')) return; // 用户自己点了按钮，不插手
  if(speechPrimed) return;
  speechPrimed = true;
  if(!state.settings.autoSpeakShow || !current || speechStarted) return;
  if(TTS_OK && (speechSynthesis.speaking || speechSynthesis.pending)) return;
  speakOnShow(true);
}
document.addEventListener('pointerdown', primeSpeech, true);
document.addEventListener('keydown', primeSpeech, true);

// ── 中文释义判分 ─────────────────────────────────────────
// 去词性/标点，把释义压成可比对的纯中文
function stripPos(s){
  var x = String(s==null?'':s).replace(/^\s*[①-⑥]*/,'');
  var guard = 0;
  while(guard++ < 8){
    var m = x.match(/^(\([^)]*\)|[A-Za-z]+\.)/);
    if(!m) break;
    x = x.slice(m[0].length);
  }
  return x.replace(/[\s（）()【】\[\]，,。、·•\/]/g,'').trim();
}
function meaningItems(m){
  // 词性标记本身也是义项分隔符："a.迟的 ad.迟，晚" 应拆成 迟的 / 迟 / 晚，
  // 否则用户答"迟到"会因为整串太长被判错。
  var POS = '(?:n|v|vt|vi|adj|adv|a|ad|art|prep|conj|pron|int|num|aux)\\.';
  var s = String(m==null?'':m).replace(/[①-⑥]/g,'；');
  s = s.replace(new RegExp('(^|[\\s；;，,])((?:'+POS+')+)','g'), '$1\u0001');
  var out = [];
  s.split(/[\u0001；;]/).forEach(function(seg){
    seg.split(/[，,、\/]/).forEach(function(x){
      x = stripPos(x).replace(/^[的地得]+/,'');
      if(x) out.push(x);
    });
  });
  return out;
}
function normInput(s){
  return String(s==null?'':s).replace(/[\s（）()【】\[\]；;，,。、·•\/]/g,'').trim();
}
function editDist(a,b){
  var A=Array.from(a), B=Array.from(b), prev=[], cur=[], i, j;
  for(j=0;j<=B.length;j++) prev[j]=j;
  for(i=1;i<=A.length;i++){
    cur[0]=i;
    for(j=1;j<=B.length;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(A[i-1]===B[j-1]?0:1));
    }
    prev=cur.slice();
  }
  return prev[B.length];
}
// 比较前去掉没有实际意义的虚词，"完全的"和"完全地"应当视为同一个答案；
// "其它/其他"是同一个词的两种写法，归一到一种
function stripMod(s){ return String(s==null?'':s).replace(/[的地得了着]/g,'').replace(/其它/g,'其他'); }
// 反义字只差一个字的，判为完全不匹配：内部/外部、前一/后一 这类不能算"接近"
function antonymClash(a,b){
  var PAIRS = {'内':'外','外':'内','上':'下','下':'上','前':'后','后':'前','大':'小','小':'大',
               '对':'错','错':'对','真':'假','假':'真','高':'低','低':'高','长':'短','短':'长',
               '多':'少','少':'多','新':'旧','旧':'新','早':'晚','晚':'早','进':'退','退':'进',
               '开':'关','关':'开','加':'减','减':'加','来':'去','去':'来','买':'卖','卖':'买'};
  var A = Array.from(a), B = Array.from(b);
  if(A.length !== B.length || A.length < 2) return false;
  var diff = 0, pa = '', pb = '';
  for(var i=0;i<A.length;i++){
    if(A[i] !== B[i]){ diff++; pa = A[i]; pb = B[i]; if(diff > 1) return false; }
  }
  return diff === 1 && PAIRS[pa] === pb;
}
function similarity(a,b){
  a = stripMod(a); b = stripMod(b);
  if(!a||!b) return 0;
  if(antonymClash(a,b)) return 0;
  if(a===b) return 1;
  if(a.indexOf(b)>=0 || b.indexOf(a)>=0){
    var s=Math.min(a.length,b.length), l=Math.max(a.length,b.length);
    return 0.75 + 0.25*(s/l);
  }
  return Math.max(0, 1 - editDist(a,b)/Math.max(a.length,b.length));
}
// 返回 {g:1|2|3, verdict, matched, alt}，g 直接喂给 FSRS
// alt 是词典里有、但主释义没写的常见义项，答对了也认（不算错）
function judge(input, meaning, alt){
  var parts = String(input==null?'':input)
    .split(/[\s，,、\/；;]+/).map(normInput)
    .filter(function(x){ return x; });
  if(!parts.length) return {g:1, verdict:'wrong', score:0, matched:'', alt:''};
  var items = meaningItems(meaning), best = 0, matched = '', altHit = '';
  for(var i=0;i<items.length;i++){
    for(var p=0;p<parts.length;p++){
      var s = similarity(parts[p], items[i]);
      if(s > best){ best = s; matched = items[i]; }
    }
  }
  if(alt && alt.length){
    for(var k=0;k<alt.length;k++){
      for(var q=0;q<parts.length;q++){
        var sa = similarity(parts[q], alt[k]);
        if(sa > best){ best = sa; matched = alt[k]; altHit = alt[k]; }
      }
    }
  }
  var g = best >= 0.62 ? 3 : best >= 0.42 ? 2 : 1;
  return { g:g, verdict: g===3?'right' : g===2?'near' : 'wrong', score:best, matched:matched, alt:altHit };
}

// ── 渲染 ─────────────────────────────────────────────────
// 拼写模式：只看英文拼写，忽略大小写和标点；错一个字母算接近
function normSpell(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z]/g,''); }
function judgeSpell(input, word){
  var a = normSpell(input), b = normSpell(word);
  if(!a) return {g:1, verdict:'wrong', score:0, matched:'', alt:''};
  var d = editDist(a,b);
  var g = d===0 ? 3 : (d===1 && b.length>4 ? 2 : 1);
  return { g:g, verdict:g===3?'right':g===2?'near':'wrong',
           score:d===0?1:Math.max(0,1-d/Math.max(3,b.length)), matched:d<=2?word:'', alt:'' };
}

  return String(s==null?'':s).replace(/[&<>"']/g,function(c){

}

// ── 统计图表（纯 SVG，零依赖）─────────────────────────────
function statsData(){
  var now = Date.now(), DAY = 86400000;
  var cards = Object.values(state.cards).filter(function(c){ return c.reps>0; });
  // 未来 14 天复习量
  var future = [];
  for(var d=0;d<14;d++){
    var start = now + d*DAY, end = start + DAY;
    // 按日期边界算（本地零点）
    var dn = new Date(start); dn.setHours(0,0,0,0);
    var dEnd = new Date(dn.getTime()+DAY);
    var n = 0;
    for(var i=0;i<cards.length;i++){
      var due = cards[i].dueAt||0;
      if(due >= dn.getTime() && due < dEnd.getTime()) n++;
    }
    future.push({ day:d, n:n, label:d===0?'今天':(d===1?'明天':(dn.getMonth()+1)+'/'+dn.getDate()) });
  }
  // 记忆强度分布：按可提取性 R 分桶
  var buckets = [0,0,0,0,0]; // <0.5, 0.5-0.7, 0.7-0.85, 0.85-0.95, >0.95
  for(var j=0;j<cards.length;j++){
    var c = cards[j];
    if(!(c.stability>0)) continue;
    var elapsed = Math.max(0,(now-(c.lastReview||now))/DAY);
    var r = FSRS.retrievability(elapsed, c.stability);
    var bi = r<0.5?0 : r<0.7?1 : r<0.85?2 : r<0.95?3 : 4;
    buckets[bi]++;
  }
  return { cards:cards, future:future, buckets:buckets };
}
function forgettingCurveSVG(){
  // FSRS 遗忘曲线：横轴 elapsed/S（0~3），纵轴 R
  var W = 320, H = 150, pad = {l:34,r:12,t:12,b:26};
  var iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  var FACTOR = 19/81, DECAY = -0.5;
  function R(x){ return Math.pow(1+FACTOR*x, DECAY); }
  var pts = [];
  for(var i=0;i<=60;i++){
    var x = i/60*3, r = R(x);
    pts.push((pad.l + x/3*iw).toFixed(1)+','+(pad.t + (1-r)*ih).toFixed(1));
  }
  // 90% 记忆线
  var y90 = pad.t + (1-0.9)*ih;
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    + '<line x1="'+pad.l+'" y1="'+(pad.t+ih)+'" x2="'+(W-pad.r)+'" y2="'+(pad.t+ih)+'" stroke="#303744" stroke-width="1"/>'
    + '<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(pad.t+ih)+'" stroke="#303744" stroke-width="1"/>'
    + '<line x1="'+pad.l+'" y1="'+y90.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+y90.toFixed(1)+'" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>'
    + '<text x="'+(pad.l-6)+'" y="'+(y90.toFixed(1)+3)+'" fill="#6b7482" font-size="9" text-anchor="end">90%</text>'
    + '<text x="'+(pad.l-6)+'" y="'+(pad.t+4)+'" fill="#6b7482" font-size="9" text-anchor="end">100</text>'
    + '<text x="'+(pad.l-6)+'" y="'+(pad.t+ih+3)+'" fill="#6b7482" font-size="9" text-anchor="end">0</text>'
    + '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#6ea8fe" stroke-width="2"/>'
    + '<circle cx="'+(pad.l+iw/3).toFixed(1)+'" cy="'+(pad.t+(1-R(1))*ih).toFixed(1)+'" r="3.5" fill="#6ea8fe"/>'
    + '<text x="'+(pad.l+iw/3).toFixed(1)+'" y="'+(pad.t+(1-R(1))*ih-9).toFixed(1)+'" fill="#9aa3b2" font-size="9" text-anchor="middle">1×S</text>'
    + '<text x="'+(pad.l+iw/2)+'" y="'+(H-6)+'" fill="#6b7482" font-size="9" text-anchor="middle">距上次复习时间 ÷ 记忆稳定性 S</text>'
    + '</svg>';
  return svg;
}
function barsSVG(future){
  var W = 320, H = 130, pad = {l:8,r:8,t:16,b:24};
  var iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  var max = Math.max(1, ...future.map(function(x){return x.n;}));
  var bw = iw/future.length * 0.68;
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    + '<line x1="'+pad.l+'" y1="'+(pad.t+ih)+'" x2="'+(W-pad.r)+'" y2="'+(pad.t+ih)+'" stroke="#303744" stroke-width="1"/>';
  future.forEach(function(x,i){
    var cx = pad.l + iw*(i+0.5)/future.length;
    var h = x.n? Math.max(3, x.n/max*ih) : 2;
    var y = pad.t+ih-h;
    var color = x.n===0 ? '#303744' : (i===0?'#6ea8fe':'#4b8ef5');
    svg += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+color+'"/>';
    if(x.n>0) svg += '<text x="'+cx.toFixed(1)+'" y="'+(y-3).toFixed(1)+'" fill="#9aa3b2" font-size="9" text-anchor="middle">'+x.n+'</text>';
    if(i%2===0 || i===0) svg += '<text x="'+cx.toFixed(1)+'" y="'+(H-7)+'" fill="#6b7482" font-size="8" text-anchor="middle">'+x.label+'</text>';
  });
  svg += '</svg>';
  return svg;
}

// 词汇量估计：基于已学词的记忆状态，保守估算，明确说明局限
function vocabEstimateHTML(){
  var now = Date.now(), DAY = 86400000;
  var cards = Object.values(state.cards).filter(function(c){ return c.reps>0; });
  var solid = 0, learning = 0;
  for(var i=0;i<cards.length;i++){
    var c = cards[i];
    if(!(c.stability>0)) continue;
    var elapsed = Math.max(0,(now-(c.lastReview||now))/DAY);
    var r = FSRS.retrievability(elapsed, c.stability);
    if(c.stability>=21 && r>=0.85) solid++;
    else if(r>=0.7) learning++;
  }
  var estimate = solid + learning;
  var book = bookById(state.settings.bookId);
  var bookTotal = book ? book.words.length : 0;
  var pct = bookTotal ? Math.min(100, Math.round(estimate/bookTotal*100)) : 0;
  var circ = 2*Math.PI*42;
  var dash = circ*pct/100;
  var svg = '<div class="vocab-box">'
    + '<svg viewBox="0 0 100 100" style="width:110px;height:110px;flex:none">'
    + '<circle cx="50" cy="50" r="42" fill="none" stroke="var(--card2)" stroke-width="8"/>'
    + '<circle cx="50" cy="50" r="42" fill="none" stroke="#6ea8fe" stroke-width="8" '
    + 'stroke-linecap="round" stroke-dasharray="'+dash.toFixed(1)+' '+(circ-dash).toFixed(1)+'" '
    + 'transform="rotate(-90 50 50)"/>'
    + '<text x="50" y="47" text-anchor="middle" fill="var(--fg)" font-size="22" font-weight="700">'+estimate+'</text>'
    + '<text x="50" y="63" text-anchor="middle" fill="var(--dim2)" font-size="9">可识别词</text></svg>'
    + '<div class="vocab-detail">'
    + '<div><b>'+solid+'</b> 牢固掌握<span>（间隔≥21天且记得）</span></div>'
    + '<div><b>'+learning+'</b> 基本认识<span>（记得概率≥70%）</span></div>'
    + '<div><b>'+bookTotal+'</b> 当前词书总词数</div>'
    + '<div style="color:var(--blue);margin-top:4px">已覆盖约 '+pct+'%</div>'
    + '</div></div>'
    + '<div class="note" style="margin:10px 0 0">这是按复习记录推算的保守值——只算你在 App 里学过且仍记得的词，'
    + '不含此前已认识的词，也不等于真实词汇量。想要准确数字需要专门的词汇量测试。</div>';
  return svg;
}
// 打卡热力图：近 12 周，按每天新词+复习量着色
function heatmapHTML(){
  var DAY = 86400000;
  var end = new Date(); end.setHours(0,0,0,0);
  var start = new Date(end.getTime()); start.setTime(start.getTime()-83*DAY);
  // 对齐到周一
  var wd = (start.getDay()+6)%7;
  start.setTime(start.getTime()-wd*DAY);
  var cells = [], total = 0, active = 0;
  var cur = new Date(start.getTime());
  var today0 = end.getTime();
  while(cur.getTime()<=today0){
    var key = cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    var l = state.dailyLog[key];
    var n = l ? ((l.neu||0)+(l.rev||0)) : 0;
    total += n; if(n>0) active++;
    var lv = n===0?0:n<10?1:n<25?2:n<50?3:4;
    var future = cur.getTime()>today0;
    cells.push('<div class="hm-cell lv'+lv+(future?' future':'')+'" title="'+key+'：'+n+' 词"></div>');
    cur.setTime(cur.getTime()+DAY);
  }
  var weeks = Math.ceil(cells.length/7);
  var html = '<div class="hm-wrap" style="--weeks:'+weeks+'"><div class="hm-grid">'+cells.join('')+'</div></div>'
    + '<div class="hm-foot"><span>少</span>'
    + [0,1,2,3,4].map(function(i){ return '<i class="hm-cell lv'+i+'"></i>'; }).join('')
    + '<span>多</span><span style="margin-left:auto">'+active+' 天打卡 · 共 '+total+' 词</span></div>';
  return html;
}
function recentDaysHTML(){
  var rows = [], keys = Object.keys(state.dailyLog).sort().reverse().slice(0,14);
  if(!keys.length) return '<div class="note">还没有学习记录</div>';
  keys.forEach(function(k){
    var l = state.dailyLog[k];
    rows.push('<div style="display:flex;justify-content:space-between;padding:6px 0;'
      + 'border-bottom:1px solid var(--line);font-size:12px">'
      + '<span style="color:var(--dim)">'+k+'</span>'
      + '<span>新 '+l.neu+' · 复习 '+l.rev+' · 认识 '+(l.good||0)+'</span></div>');
  });
  return rows.join('');
}
function renderWordList(q){

    return !q || String(c.w).toLowerCase().indexOf(q)>=0 || String(c.m).indexOf(q)>=0;
  });
  items.sort(function(a,b){ return String(a.w).localeCompare(String(b.w)); });
  if(!items.length){ box.innerHTML='<div class="note">没有匹配的词</div>'; return; }
  box.innerHTML = items.slice(0,60).map(function(c){
    var st = c.state==='new' ? '未复习' : (c.dueAt<=Date.now() ? '待复习' : FSRS.humanizeDuration(c.dueAt-Date.now())+'后');

}

function toggleFamiliar(){
  if(!current) return;
  var k = cardKey(current.w), c = state.cards[k];
  if(!c) return;
  c.familiar = !c.familiar;
  c.enabled = !c.familiar;
  var wasCurrent = cardKey(current.w) === k;
  session.queue = session.queue.filter(function(x){ return !x || cardKey(x.w)!==k; });
  saveNow();
  if(c.familiar && wasCurrent){
    document.getElementById('wordPanel').classList.add('hidden');
    next();
    toast('已标记熟知，这张词不再出现');

    openWordInfo(); render();

document.addEventListener('click', function(e){

    syncQuick(); return;
  }

  if(catBtn){
    bookCat = catBtn.dataset.cat; bookQuery = '';

    for(var k=0;k<ins.length;k++) ins[k].value='';
    refreshBookGrid(); return;
  }
  var bookBtn = e.target.closest('[data-book]');
  if(bookBtn){
    var bid = bookBtn.dataset.book;
    if(bid===state.settings.bookId) return;
    state.settings.bookId = bid;
    var nb = bookById(bid);
    if(nb && nb.cat) bookCat = nb.cat;
    resetPendingNew();
    saveNow(); buildSession(); next();
    document.getElementById('bookPicker').classList.add('hidden');  // 选完自动关
    if(!document.getElementById('panel').classList.contains('hidden')) renderSheet();
    toast('已切换到「'+bookName()+'」词书'); return;
  }
  var segBtn = e.target.closest('[data-seg] button');
  if(segBtn){
    var name = segBtn.parentElement.dataset.seg;
    var val = segBtn.dataset.val;
    if(name==='dailyNew') state.settings.dailyNew = parseInt(val,10);
    else if(name==='retention') state.settings.retention = parseFloat(val);
    else if(name==='accent') state.settings.accent = val;
    else if(name==='hidePh') state.settings.hidePh = val==='1';
    else if(name==='autoSpeak') state.settings.autoSpeak = val==='1';
    else if(name==='autoSpeakShow') state.settings.autoSpeakShow = val==='1';
    else if(name==='customOn'){ state.settings.customOn = val==='1'; resetPendingNew(); saveNow(); buildSession(); next(); renderSheet(); }
    save(); renderSheet(); header(); return;
  }
  var tabBtn = e.target.closest('.tab');
  if(tabBtn){ tab=tabBtn.dataset.tab; renderSheet(); return; }
  var wo = e.target.closest('[data-wo]');
  if(wo){
    var key = wo.closest('[data-word]').dataset.word;
    if(wo.dataset.wo==='toggle'){
      state.cards[key].enabled = state.cards[key].enabled===false;
      toast(state.cards[key].enabled?'已启用':'已停用，不再出现在队列');

      delete state.cards[key];
      toast('已删除该词的复习进度');

    saveNow(); renderWordList(document.getElementById('wsearch').value); return;
  }
  var b = e.target.closest('[data-action]');
  if(!b) return;
  var a = b.dataset.action;
  if(a==='speak' && current) speak(current.w);
  else if(a==='speakText' && b.dataset.text) speak(b.dataset.text);
  else if(a==='wordInfo') openWordInfo();
  else if(a==='closeWordInfo') closeWordInfo();
  else if(a==='toggleFamiliar') toggleFamiliar();
  else if(a==='saveNote'){
    if(!current) return;
    var ni = document.getElementById('noteInput');
    current.note = ni ? ni.value.trim() : '';
    state.cards[cardKey(current.w)] = current;
    saveNow(); toast(current.note ? '助记已保存' : '助记已清空');
    if(feedback) render();
  }
  else if(a==='setInputMode') setInputMode(b.dataset.mode);
  else if(a==='quickRate') quickRate(parseInt(b.dataset.g,10));
  else if(a==='submitInput') submitInput();
  else if(a==='confirm') confirmFeedback(false);
  else if(a==='forceGood') confirmFeedback(true);
  else if(a==='undoRating') undoRating();
  else if(a==='settings') openPanel();
  else if(a==='closePanel') closePanel();
  else if(a==='openBookPicker') openBookPicker();
  else if(a==='closeBookPicker') closeBookPicker();
  else if(a==='openPlan') openPlan();
  else if(a==='reviewLearned') reviewLearned(parseInt(b.dataset.days,10)||1);
  else if(a==='cutToday') cutToday(parseInt(b.dataset.n,10)||10);
  else if(a==='resetToday') resetToday();
  else if(a==='closePlan') document.getElementById('planPanel').classList.add('hidden');
  else if(a==='savePlan') savePlan();
  else if(a==='saveDailyNew'){
    var dv = parseInt(document.getElementById('setDailyNew').value,10);
    if(!isFinite(dv)||dv<1||dv>500){ toast('请输入 1 到 500 的数字'); return; }
    state.settings.dailyNew = dv; saveNow(); buildSession(); next(); renderSheet();
    toast('每日新词已设为 '+dv+' 个');
  }
  else if(a==='more'){
    state.settings.dailyNew += 10; saveNow(); buildSession(); next();
  }
  else if(a==='importWords'){
    var txt = document.getElementById('importText').value;
    var added = parseWords(txt);
    if(!added.length){ toast('没解析出词，检查一下格式'); return; }
    state.customPool = state.customPool.concat(added);
    state.settings.customOn=true;
    resetPendingNew();
    saveNow(); buildSession(); next(); renderSheet();
    toast('导入 '+added.length+' 词，已切换到自定义词库');
  }
  else if(a==='clearCustom'){
    if(!confirm('清空自定义词库？已学单词的进度会保留。')) return;
    state.customPool=[]; state.settings.customOn=false;
    resetPendingNew();
    saveNow(); buildSession(); next(); renderSheet();
  }
  else if(a==='export'){
    var blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a2 = document.createElement('a');
    a2.href=url; a2.download='memo-backup-'+todayKey()+'.json';
    document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    toast('备份已导出');
  }
  else if(a==='saveDataBase'){
    var v = document.getElementById('dataBaseInput').value.trim().replace(/\/+$/,'');
    state.settings.dataBase = v; saveNow();
    toast('已保存，正在重新获取词库…');
    document.getElementById('boot').classList.remove('hidden');
    document.getElementById('bootMsg').textContent='正在获取词库…';
    window.__memoLoadData(true, function(st){
      document.getElementById('boot').classList.add('hidden');
      if(bookById(state.settings.bookId)===null && getBooks().length) state.settings.bookId='cet4';
      buildSession(); next(); renderSheet(); header();
      toast(st.books ? ('词库已更新（'+dataSourceLabel()+'）') : '获取失败，仍用内置词表');
    });
  }
  else if(a==='clearDataCache'){
    if(!confirm('清除已缓存的词库，从网络重新获取？')) return;
    document.getElementById('boot').classList.remove('hidden');
    document.getElementById('bootMsg').textContent='正在重新获取词库…';
    window.__memoLoadData(true, function(st){
      document.getElementById('boot').classList.add('hidden');
      buildSession(); next(); renderSheet(); header();
      toast(st.books ? ('词库已更新（'+dataSourceLabel()+'）') : '获取失败，仍用内置词表');
    });
  }
  else if(a==='importBackup'){ document.getElementById('fileInput').click(); }
  else if(a==='reset'){
    if(!confirm('清空全部进度？此操作不可撤销，建议先导出备份。')) return;
    var sets = state.settings;
    state = defaults(); state.settings = sets;
    saveNow(); buildSession(); next(); renderSheet(); toast('进度已清空');
  }
});
document.addEventListener('input', function(e){
  if(e.target.id==='planInput') syncQuick();
  if(e.target.id==='wsearch') renderWordList(e.target.value);
  if(e.target.dataset && e.target.dataset.role==='bookSearch'){
    bookQuery = e.target.value;
    refreshBookGrid();   // 只换网格，搜索框和焦点都不动
    // 让其他面板的搜索框保持同步
    var inputs = document.querySelectorAll('[data-role="bookSearch"]');
    for(var i=0;i<inputs.length;i++) if(inputs[i]!==e.target) inputs[i].value = bookQuery;
  }
  if(e.target.id==='typeInput') updateActionArea();
});
document.addEventListener('change', function(e){
  if(e.target.id!=='fileInput' || !e.target.files[0]) return;
  var f = e.target.files[0], r = new FileReader();
  r.onload = function(){
    try{
      var s = JSON.parse(r.result);
      if(s.version!==1 || !s.cards) throw new Error('不是有效的备份文件');
      state = s; saveNow(); buildSession(); next(); closePanel();
      toast('已恢复 '+Object.keys(state.cards).length+' 个词的进度');
    }catch(err){ toast('导入失败：'+err.message); }
    e.target.value='';
  };
  r.readAsText(f);
});
document.getElementById('wordPanel').addEventListener('click', function(e){
  if(e.target === this) closeWordInfo();
});
document.getElementById('bookPicker').addEventListener('click', function(e){
  if(e.target === this) closeBookPicker();
});
document.getElementById('planPanel').addEventListener('click', function(e){
  if(e.target === this) document.getElementById('planPanel').classList.add('hidden');
});
document.addEventListener('keydown', function(e){
  if(!document.getElementById('planPanel').classList.contains('hidden')){
    if(e.key==='Escape'){ e.preventDefault(); document.getElementById('planPanel').classList.add('hidden'); }
    else if(e.key==='Enter' && document.activeElement && document.activeElement.id==='planInput'){
      e.preventDefault(); savePlan();
    }
    return;
  }
  if(!document.getElementById('bookPicker').classList.contains('hidden')){
    if(e.key==='Escape'){ e.preventDefault(); closeBookPicker(); }
    return;
  }
  if(!document.getElementById('wordPanel').classList.contains('hidden')){
    if(e.key==='Escape') closeWordInfo();
    return;
  }
  if(!document.getElementById('panel').classList.contains('hidden')){
    if(e.key==='Escape') closePanel();
    return;
  }
  if(feedback){
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); confirmFeedback(false); }
    return;
  }
  if(e.key==='Enter'){
    e.preventDefault(); submitInput();
  }else if(e.key==='1'||e.key==='2'||e.key==='3'){
    // 输入框为空时，数字键直接当档位用
    var inp = document.getElementById('typeInput');
    if(inp && inp.value.trim()) return;  // 有字时让数字正常输入
    quickRate(parseInt(e.key,10));
  }else if(e.key==='s'||e.key==='S'){
    if(e.target.id!=='typeInput' && current) speak(current.w);
  }
});

function parseWords(txt){
  var out=[], seen={};
  var lines = String(txt||'').replace(/^\uFEFF/,'').split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var s=lines[i].trim(); if(!s) continue;
    var m=s.match(/^([A-Za-z][A-Za-z.'\-]*)\s*(?:\[([^\]]*)\])?\s*(.+)$/);
    var w,ph,mean;
    if(m){ w=m[1]; ph=m[2]||''; mean=m[3]; }
    else{
      var p=s.split(/\t+/);
      if(p.length<2) continue;
      w=p[0].trim(); ph=(p.length>=3?p[1].trim():''); mean=(p.length>=3?p[2]:p[1]).trim();
    }
    var k=w.toLowerCase(); if(seen[k]||!mean) continue;
    seen[k]=1; out.push({w:w,p:ph,m:mean});
  }
  return out;
}

// ── 启动 ─────────────────────────────────────────────────
function bootDone(status){
  if(!bookById(state.settings.bookId) && getBooks().length) state.settings.bookId='cet4';
  if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); }catch(e){} }
  buildSession();
  next();
  var boot=document.getElementById('boot');
  if(boot) boot.classList.add('hidden');
  if(!status.books) toast('词库未就绪，正在用内置四级词表 · 可在设置里重试');
  else if(/^(https?:\/\/|\.\/|\/)/.test(status.source||'')){
    var tag = status.source.indexOf('gitee')>=0 ? 'Gitee' : (status.source.indexOf('jsdelivr')>=0 ? 'CDN' : 'GitHub');
    toast('词库已更新（'+tag+'）');
  }
  if(!storageOK) warnNoStorage();
  if(!document.getElementById('panel').classList.contains('hidden')) renderSheet();
}
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); }catch(e){} }
if(window.__memoLoadData) window.__memoLoadData(bootDone);
else bootDone({books:false,examples:false,source:''});
})();
</script>
